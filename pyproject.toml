[project]
name = "korea-rio-mcp"
version = "0.1.0"
description = "Regional Input-Output (RIO) economic-impact analysis as a cross-platform MCP server (Bank of Korea regional IO tables)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Namun Cho", email = "namun.cho@gmail.com" }]
keywords = [
    "mcp", "model-context-protocol", "input-output-analysis",
    "economic-impact", "regional-economics", "bank-of-korea", "korea",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
    "Topic :: Office/Business :: Financial",
]
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/z0nam/korea-rio-mcp"
Repository = "https://github.com/z0nam/korea-rio-mcp"
Issues = "https://github.com/z0nam/korea-rio-mcp/issues"

[project.scripts]
korea-rio-mcp = "rio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_mcp"]

[tool.hatch.build.targets.wheel.force-include]
# Reference CSVs live only at the repo top level; the 17 coefficient tables are
# already inside the package (src/rio_mcp/data/coefficients), so they need no
# force-include — adding one re-bundles a stale top-level copy as a duplicate.
"data/reference" = "rio_mcp/data/reference"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
