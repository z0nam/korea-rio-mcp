[project]
name = "korea-rio-mcp"
version = "0.1.0"
description = "Regional Input-Output (RIO) economic-impact analysis as a cross-platform MCP server (Bank of Korea regional IO tables)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2.0",
    "pandas>=2.0",
    "openpyxl>=3.1",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
korea-rio-mcp = "rio_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rio_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"data/reference" = "rio_mcp/data/reference"
"data/coefficients" = "rio_mcp/data/coefficients"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
